<!doctype html>
<html><head><meta charset="utf-8"><title>0x72 atlas regions</title>
<style>
body{background:#15120f;color:#e8dcc4;font:11px monospace;margin:16px}
h1{font:18px Georgia,serif;color:#e8c68d;margin:0 0 12px}
h2{font:15px Georgia,serif;color:#d8b981;margin:18px 0 6px}
.panel{display:inline-block;vertical-align:top;margin:0 20px 20px 0;padding:8px;border:1px solid #5b4636;background:#0f0c0a}
canvas{image-rendering:pixelated;display:block}
.cap{color:#b8a482;margin-top:6px}
</style></head><body>
<h1>0x72 atlas region inspection (nearest-neighbor)</h1>
<div id="out"></div>
<script>
(async()=>{
 const out=document.getElementById('out');
 const load=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
 const main=await load('assets/atlas.png');
 const low=await load('assets/walls-low.png');
 const high=await load('assets/walls-high.png');
 const floor=await load('assets/floors.png');

 function panel(title,img,sx,sy,sw,sh,scale,labelEvery=16){
   const cv=document.createElement('canvas');cv.width=sw*scale;cv.height=sh*scale;
   const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
   c.drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
   // grid
   c.strokeStyle='rgba(232,198,141,.28)';c.lineWidth=1;
   for(let x=0;x<=sw;x+=labelEvery){const px=x*scale;c.beginPath();c.moveTo(px+.5,0);c.lineTo(px+.5,cv.height);c.stroke();}
   for(let y=0;y<=sh;y+=16){const py=y*scale;c.beginPath();c.moveTo(0,py+.5);c.lineTo(cv.width,py+.5);c.stroke();}
   // coords
   c.fillStyle='rgba(0,0,0,.55)';c.font='9px monospace';
   for(let x=0;x<sw;x+=labelEvery){for(let y=0;y<sh;y+=16){c.fillStyle='rgba(0,0,0,.6)';const t=`${sx+x},${sy+y}`;const w=c.measureText(t).width;c.fillRect(x*scale+1,y*scale+1,w+2,10);c.fillStyle='#f0d9a8';c.fillText(t,x*scale+2,y*scale+9);}}
   const wrap=document.createElement('div');wrap.className='panel';wrap.append(cv);
   const cap=document.createElement('div');cap.className='cap';cap.textContent=title;wrap.append(cap);
   out.append(wrap);
 }
 panel('main atlas · walls/floor region (0,0 112x192)',main,0,0,112,192,8);
 panel('main atlas · walls/floor+doors region (0,0 112x272)',main,0,0,112,272,6);
 panel('main atlas · doors region (0,208 112x80)',main,0,208,112,80,8);
 panel('low wall atlas (192x64)',low,0,0,192,64,8);
 panel('high wall atlas (384x128)',high,0,0,384,128,4);
 panel('floor atlas (112x112)',floor,0,0,112,112,8);
})();
</script></body></html>
