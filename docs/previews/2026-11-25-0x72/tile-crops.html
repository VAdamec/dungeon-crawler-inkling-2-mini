<!doctype html>
<html><head><meta charset="utf-8"><title>0x72 tile crops</title>
<style>
body{background:#15120f;color:#e8dcc4;font:11px monospace;margin:16px}
h1{font:18px Georgia,serif;color:#e8c68d}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.t{width:76px;text-align:center}
.chk{width:64px;height:64px;margin:0 auto;background:
 conic-gradient(#242424 25%,#1a1a1a 0 50%,#242424 0 75%,#1a1a1a 0) 0 0/16px 16px}
canvas{image-rendering:pixelated;display:block;width:64px;height:64px}
.lab{font-size:8px;line-height:1.15;color:#d6bd91;word-break:break-word;margin-top:3px}
.sec{font:15px Georgia,serif;color:#d8b981;margin:14px 0 8px}
</style></head><body>
<h1>0x72 named tile crops (16x nearest, checker = transparent)</h1>
<div id="out"></div>
<script>
(async()=>{
 const rows=(await (await fetch('assets/tile_list_v1.7')).text()).trim().split(/\n/).map(l=>{const [name,x,y,w,h]=l.trim().split(/\s+/);return{name,x:+x,y:+y,w:+w,h:+h}});
 const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src='assets/atlas.png'});
 const out=document.getElementById('out');
 const want=[
  ['wall caps',/^wall_top_/],
  ['wall faces',/^wall_(left|mid|right)$/],
  ['wall outer',/^wall_outer_/],
  ['wall edge',/^wall_edge_/],
  ['floors',/^floor_[1-8]$/],
  ['special floor',/^(hole|edge_down|floor_ladder|floor_stairs|floor_spikes_anim_f0)$/],
  ['doors',/^doors_/],
  ['props',/^(column|column_wall|wall_banner_red|wall_hole_1|wall_goo|wall_fountain_mid_red_anim_f0|wall_fountain_basin_red_anim_f0|crate|skull)$/],
 ];
 for(const [title,re] of want){
   const sec=document.createElement('div');sec.className='sec';sec.textContent=title;out.append(sec);
   const row=document.createElement('div');row.className='row';
   for(const t of rows.filter(t=>re.test(t.name))){
     const d=document.createElement('div');d.className='t';
     const chk=document.createElement('div');chk.className='chk';
     const cv=document.createElement('canvas');cv.width=t.w;cv.height=t.h;cv.style.width=`${t.w*4}px`;cv.style.height=`${t.h*4}px`;
     const c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(im,t.x,t.y,t.w,t.h,0,0,t.w,t.h);
     chk.append(cv);
     const lab=document.createElement('div');lab.className='lab';lab.textContent=t.name;
     d.append(chk,lab);row.append(d);
   }
   out.append(row);
 }
})();
</script></body></html>
